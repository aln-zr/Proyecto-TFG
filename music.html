            </ul>
        </nav>
    </header>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            let header = document.querySelector("header");
    
            // Ensure header starts hidden
            header.style.opacity = "0";
            header.style.top = "-200px"; // Move it off-screen
    
            window.addEventListener("scroll", function () {
                if (window.scrollY > 100) { // Show header after scrolling 50px
                    header.style.opacity = "1";
                    header.style.top = "0";
                } else {
                    header.style.opacity = "0";
                    header.style.top = "-200px"; // Keep it off-screen when at top
                }
            });
        });
    </script>


    <section id="music">
        <h2>Our new album </h2>
        <h3 class="music-h3">Disrupted</h3>
    </section>

    </section>
